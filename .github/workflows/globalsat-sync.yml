name: Sincronizar GlobalSAT

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: globalsat-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Solicitar sincronização
        env:
          APP_URL: ${{ secrets.APP_URL }}
          GLOBALSAT_SYNC_SECRET: ${{ secrets.GLOBALSAT_SYNC_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$GLOBALSAT_SYNC_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 45 \
            -X POST \
            -H "Authorization: Bearer $GLOBALSAT_SYNC_SECRET" \
            "$APP_URL/api/integrations/globalsat/cron"
