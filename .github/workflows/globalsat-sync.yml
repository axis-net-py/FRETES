name: Sincronizar GlobalSAT

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

concurrency:
  group: globalsat-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Solicitar sincronização
        env:
          APP_URL: ${{ secrets.APP_URL }}
          GLOBALSAT_SYNC_SECRET: ${{ secrets.GLOBALSAT_SYNC_SECRET }}
        run: |
          TARGET_URL="${APP_URL:-https://axis-fretes.vercel.app}"
          if [ -n "$GLOBALSAT_SYNC_SECRET" ]; then
            curl --fail-with-body --silent --show-error \
              --retry 2 --max-time 60 \
              -X POST \
              -H "Authorization: Bearer $GLOBALSAT_SYNC_SECRET" \
              "$TARGET_URL/api/integrations/globalsat/cron" || \
            curl --fail-with-body --silent --show-error \
              --retry 2 --max-time 60 \
              -X POST \
              "$TARGET_URL/api/integrations/globalsat/sync"
          else
            curl --fail-with-body --silent --show-error \
              --retry 2 --max-time 60 \
              -X POST \
              "$TARGET_URL/api/integrations/globalsat/sync"
          fi

